<section>
  <h2 class="mb-5">Novo Relatório</h2>
  <form [formGroup]="form">
    <div class="row" title="Empresa">
      <div class="col-12 col-sm-6 col-lg-4">
        <ui-input
          label="CNPJ"
          [maxlength]="18"
          mask="00.000.000/0000-00"
          placeholder="Informe o cnpj"
          formControlName="cnpj"
        />
      </div>
      <div class="col-12 col-sm-6 col-lg-4">
        <ui-input label="Empresa" placeholder="Informe o nome" formControlName="company" />
      </div>
      <div class="col-12 col-sm-12 col-lg-4">
        <ui-input label="Sigla" placeholder="Informe a sigla" formControlName="abbreviation" />
      </div>
    </div>
    <div class="row" title="Endereço">
      <div class="col-12 col-sm-4 col-lg-3">
        <ui-input label="CEP" placeholder="Informe o CEP" formControlName="cep" />
      </div>
      <div class="col-12 col-sm-5 col-lg-3">
        <ui-input label="Bairro" placeholder="Informe o bairro" formControlName="neighborhood" />
      </div>
      <div class="col-12 col-sm-3 col-lg-3">
        <ui-input label="Número" placeholder="Informe o número" formControlName="number" />
      </div>
      <div class="col-12 col-lg-3">
        <ui-input label="Logradouro" placeholder="Informe o logradouro" formControlName="st" />
      </div>
    </div>
    <div class="row" title="Contato">
      <div class="col-12 col-lg-4">
        <ui-input label="Telefone" placeholder="Informe o telefone" formControlName="tel" />
      </div>
    </div>
    <div class="buttons">
      <button [routerLink]="'/documents'">Voltar</button>
      <button>Salvar</button>
    </div>
  </form>
</section>
