<section>
  <h2>Lista de Relatórios</h2>
  <div class="filters"></div>
  <div class="table-container">
    <table>
      <thead>
        <th>Nº Relatório</th>
        <th>Empresa</th>
        <th>Tag</th>
        <th>Dt. Inspeção</th>
        <th>Venc. Exame</th>
        <th>Recomendações</th>
        <th></th>
      </thead>
      <tbody>
        @for (item of reports(); track $index) {
          <tr>
            <td>{{ item.reportNumber }}</td>
            <td>{{ item.company }}</td>
            <td>{{ item.tag }}</td>
            <td>{{ item.inspectionDate }}</td>
            <td>{{ item.examExpirationDate }}</td>
            <td>{{ item.recommendations }}</td>
            <td>
              <div class="buttons">
                <button [ui-tooltip]="'Editar'">
                  <span class="material-symbols-outlined"> edit </span>
                </button>
                 <button class="text-feedback-danger-500" [ui-tooltip]="'Excluir'">
                  <span class="material-symbols-outlined"> delete </span>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
